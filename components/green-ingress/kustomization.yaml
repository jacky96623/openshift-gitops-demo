apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# resources:
#   - ../crds # Ref: https://github.com/kubernetes-sigs/kustomize/issues/2078#issuecomment-573314770
#   - blue.yaml
#   - green.yaml

patches:
  - target:
      name: ing
    patch: | # yaml
      - op: add
        path: /metadata/annotations
        value:
          nginx.ingress.kubernetes.io/canary: "true"
          nginx.ingress.kubernetes.io/canary-by-header: X-User-Type
          nginx.ingress.kubernetes.io/canary-by-header-value: Pilot
