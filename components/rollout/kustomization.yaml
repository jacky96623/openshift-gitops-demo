apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configurations:
  - https://argoproj.github.io/argo-rollouts/features/kustomize/rollout-transform-kustomize-v5.yaml

resources:
  - rollout.yaml

components:
  - ../app-label

patches:
  - target:
      name: rollout
    patch: | # yaml
      - op: remove
        path: /spec/selector
      - op: remove
        path: /spec/template
