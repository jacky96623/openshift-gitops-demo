apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      env: sit
    includeTemplates: true

resources:
  - ../../base

replicas:
  - name: deploy
    count: 2

patches:
  - target:
      name: ing
    patch: | # yaml
      - op: replace
        path: /spec/rules/0/host
        value: rollouts-demo-ing-rollouts-demo-sit.apps.q4n4p.dynamic.redhatworkshops.io
