apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: rollouts-demo-
nameSuffix: -green
# REVIEW
labels:
  - pairs:
      blue-green.rollout/zone: green
    includeSelectors: true
  - pairs:
      env: prod
    includeTemplates: true

resources:
  - ../../base

# components:
#   - ../../components/green-ingress

replicas:
  - name: deploy
    count: 1

patches:
  - target:
      name: svc
    patch: | # yaml
      kind: __kind__
      metadata:
        name: __name__
        annotations:
          argocd.argoproj.io/sync-options: Replace=true
  - target:
      name: ing
    patch: | # yaml
      - op: replace
        path: /spec/rules/0/host
        value: rollouts-demo-ing-rollouts-demo.apps.q4n4p.dynamic.redhatworkshops.io
