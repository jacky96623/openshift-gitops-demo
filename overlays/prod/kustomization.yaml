apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replicas:
  - name: deploy
    count: 0
  - name: rollout
    count: 4

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
    patch: |
      - op: remove
        path: /spec/template
