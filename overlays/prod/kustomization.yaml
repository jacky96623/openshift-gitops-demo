apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: rollouts-demo-
labels:
  - pairs:
      app: rollouts-demo
    includeSelectors: true
  - pairs:
      env: prod
    includeTemplates: true
  # - pairs:
  #     blue-green.rollout/zone: blue

resources:
  - ../../base

components:
  - ../../components/green-service

replicas:
  - name: deploy
  #   count: 0
  # - name: rollout
    count: 4

patches:
  # - target:
  #     name: rollout
  #   patch: | # yaml
  #     - op: remove
  #       path: /spec/selector
  #     - op: remove
  #       path: /spec/template
  - target:
      name: ing
    patch: | # yaml
      - op: replace
        path: /spec/rules/0/host
        value: rollouts-demo-ing-rollouts-demo.apps.q4n4p.dynamic.redhatworkshops.io
