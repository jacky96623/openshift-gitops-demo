apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# REVIEW
namePrefix: rollouts-demo-
labels:
  - pairs:
      app: rollouts-demo
    includeSelectors: true
  - pairs:
      blue-green.rollout/zone: blue

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Deployment
images:
  - name: <image>
    newName: argoproj/rollouts-demo
    newTag: purple
